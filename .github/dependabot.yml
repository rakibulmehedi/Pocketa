# Dependabot configuration for automated dependency updates
version: 2
updates:
  # Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    reviewers:
      - "rakibulislammehedi"
    assignees:
      - "rakibulislammehedi"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "flutter"
      - "automated"
    groups:
      # Group minor and patch updates together
      flutter-minor-patch:
        patterns:
          - "flutter*"
          - "dart*"
        update-types:
          - "minor"
          - "patch"
      # Group UI/UX dependencies
      ui-dependencies:
        patterns:
          - "*material*"
          - "*cupertino*"
          - "*widget*"
          - "*theme*"
        update-types:
          - "minor"
          - "patch"
      # Group state management dependencies
      state-management:
        patterns:
          - "*riverpod*"
          - "*provider*"
          - "*bloc*"
          - "*cubit*"
        update-types:
          - "minor"
          - "patch"
      # Group testing dependencies
      testing:
        patterns:
          - "*test*"
          - "*mock*"
          - "*fake*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "flutter"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flutter_riverpod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hive"
        update-types: ["version-update:semver-major"]
      - dependency-name: "path_provider"
        update-types: ["version-update:semver-major"]
      - dependency-name: "shared_preferences"
        update-types: ["version-update:semver-major"]
      # Ignore specific versions that cause issues
      - dependency-name: "file_picker"
        versions: ["6.0.0", "6.0.1"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "rakibulislammehedi"
    assignees:
      - "rakibulislammehedi"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker (if used)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "rakibulislammehedi"
    assignees:
      - "rakibulislammehedi"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
