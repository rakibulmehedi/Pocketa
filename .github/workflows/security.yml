name: Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # =============================================================================
  # DEPENDENCY VULNERABILITY SCAN
  # =============================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run security audit
        run: |
          echo "🔍 Running Flutter security audit..."
          flutter pub audit
          
          # Check for outdated dependencies with known vulnerabilities
          echo "📋 Checking for outdated dependencies..."
          flutter pub outdated || true

      - name: Check for known vulnerable packages
        run: |
          echo "🚨 Checking for known vulnerable packages..."
          
          # List of known vulnerable packages (update as needed)
          VULNERABLE_PACKAGES=(
            "crypto:2.1.5"
            "http:0.12.2"
            "path:1.8.0"
          )
          
          for package in "${VULNERABLE_PACKAGES[@]}"; do
            if grep -q "$package" pubspec.lock; then
              echo "❌ Vulnerable package detected: $package"
              exit 1
            fi
          done
          
          echo "✅ No known vulnerable packages detected"

  # =============================================================================
  # SECRETS DETECTION
  # =============================================================================
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Manual secrets check
        run: |
          echo "🔍 Manual secrets detection..."
          
          # Check for common secret patterns
          SECRET_PATTERNS=(
            "password\s*=\s*['\"][^'\"]{8,}['\"]"
            "secret\s*=\s*['\"][^'\"]{8,}['\"]"
            "key\s*=\s*['\"][^'\"]{8,}['\"]"
            "token\s*=\s*['\"][^'\"]{8,}['\"]"
            "api_key\s*=\s*['\"][^'\"]{8,}['\"]"
            "private_key\s*=\s*['\"][^'\"]{8,}['\"]"
            "access_token\s*=\s*['\"][^'\"]{8,}['\"]"
            "refresh_token\s*=\s*['\"][^'\"]{8,}['\"]"
          )
          
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if grep -r -i -E "$pattern" lib/ --include="*.dart" | grep -v "// TODO\|// FIXME\|// NOTE"; then
              echo "❌ Potential secret detected: $pattern"
              exit 1
            fi
          done
          
          # Check for hardcoded URLs with credentials
          if grep -r -i "https://[^:]*:[^@]*@" lib/ --include="*.dart"; then
            echo "❌ Hardcoded credentials in URLs detected"
            exit 1
          fi
          
          # Check for sensitive files
          SENSITIVE_FILES=(
            "*.keystore"
            "*.jks"
            "*.p12"
            "*.pem"
            "*.key"
            "*.crt"
            "*.cer"
            "*.pfx"
            "*.mobileprovision"
            "*.provisionprofile"
            "secrets.json"
            "secrets.yaml"
            "secrets.yml"
            ".env"
            ".env.local"
            ".env.production"
            "config/secrets/"
          )
          
          for file_pattern in "${SENSITIVE_FILES[@]}"; do
            if find . -name "$file_pattern" | grep -v ".gitignore"; then
              echo "❌ Sensitive file detected: $file_pattern"
              exit 1
            fi
          done
          
          echo "✅ No secrets detected"

  # =============================================================================
  # CODE SECURITY ANALYSIS
  # =============================================================================
  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Security code analysis
        run: |
          echo "🔍 Running security code analysis..."
          
          # Check for SQL injection vulnerabilities
          if grep -r -i "SELECT\|INSERT\|UPDATE\|DELETE" lib/ --include="*.dart" | grep -v "// TODO\|// FIXME"; then
            echo "⚠️  Potential SQL injection vulnerability detected"
          fi
          
          # Check for XSS vulnerabilities
          if grep -r -i "innerHTML\|outerHTML\|document\.write" lib/ --include="*.dart"; then
            echo "⚠️  Potential XSS vulnerability detected"
          fi
          
          # Check for insecure random number generation
          if grep -r "Random\." lib/ --include="*.dart" | grep -v "// TODO\|// FIXME"; then
            echo "⚠️  Insecure random number generation detected"
          fi
          
          # Check for hardcoded cryptographic keys
          if grep -r -i "aes\|des\|rsa\|md5\|sha1" lib/ --include="*.dart" | grep -v "// TODO\|// FIXME"; then
            echo "⚠️  Potential hardcoded cryptographic keys detected"
          fi
          
          # Check for debug prints in production code
          if grep -r "print\|debugPrint\|printDebugInformation" lib/ --include="*.dart" | grep -v "// TODO\|// FIXME\|// NOTE"; then
            echo "❌ Debug prints found in production code"
            exit 1
          fi
          
          # Check for proper error handling
          if grep -r "catch.*{" lib/ --include="*.dart" | grep -v "// TODO\|// FIXME" | grep -v "rethrow"; then
            echo "⚠️  Empty catch blocks detected - ensure proper error handling"
          fi
          
          # Check for sensitive data in error messages
          if grep -r "throw.*Exception.*password\|throw.*Exception.*secret" lib/ --include="*.dart"; then
            echo "❌ Potential sensitive data in error messages"
            exit 1
          fi
          
          echo "✅ Security code analysis completed"

  # =============================================================================
  # CONTAINER SECURITY (if using Docker)
  # =============================================================================
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: hashFiles('Dockerfile') != ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # LICENSE COMPLIANCE
  # =============================================================================
  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check license compliance
        run: |
          echo "📋 Checking license compliance..."
          
          # List of problematic licenses
          PROBLEMATIC_LICENSES=(
            "GPL"
            "AGPL"
            "LGPL"
            "Copyleft"
          )
          
          # Check pubspec.lock for license information
          if [ -f pubspec.lock ]; then
            for license in "${PROBLEMATIC_LICENSES[@]}"; do
              if grep -i "$license" pubspec.lock; then
                echo "⚠️  Potentially problematic license detected: $license"
              fi
            done
          fi
          
          # Check for license files
          if [ ! -f LICENSE ] && [ ! -f LICENSE.txt ] && [ ! -f LICENSE.md ]; then
            echo "⚠️  No LICENSE file found in repository"
          fi
          
          echo "✅ License compliance check completed"

  # =============================================================================
  # SECURITY SUMMARY
  # =============================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, secrets-scan, code-security, container-security, license-compliance]
    if: always()
    
    steps:
      - name: Generate security summary
        run: |
          echo "🔒 Security Pipeline Summary"
          echo "=============================="
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Secrets Detection: ${{ needs.secrets-scan.result }}"
          echo "Code Security: ${{ needs.code-security.result }}"
          echo "Container Security: ${{ needs.container-security.result }}"
          echo "License Compliance: ${{ needs.license-compliance.result }}"
          
          if [[ "${{ needs.dependency-scan.result }}" != "success" || 
                "${{ needs.secrets-scan.result }}" != "success" || 
                "${{ needs.code-security.result }}" != "success" || 
                "${{ needs.container-security.result }}" != "success" || 
                "${{ needs.license-compliance.result }}" != "success" ]]; then
            echo "❌ Security pipeline failed"
            exit 1
          fi
          
          echo "✅ All security checks passed"
