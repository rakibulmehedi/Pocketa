name: 🛡️ CI Guard

on:
  workflow_run:
    workflows: ["CI Pipeline", "Security Pipeline", "Code Quality"]
    types: [completed]
  schedule:
    # Run daily at 4 AM UTC to check workflow health
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.8'

jobs:
  # =============================================================================
  # WORKFLOW HEALTH CHECK
  # =============================================================================
  workflow-health:
    name: Workflow Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Check workflow status
        run: |
          echo "🔍 Checking workflow health..."
          
          # Get recent workflow runs
          echo "## Recent Workflow Runs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Status | Conclusion | Run Time |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------------|----------|" >> $GITHUB_STEP_SUMMARY
          
          # Check CI Pipeline
          CI_RUNS=$(gh run list --workflow="ci.yml" --limit=5 --json status,conclusion,createdAt,displayTitle)
          echo "$CI_RUNS" | jq -r '.[] | "| CI Pipeline | \(.status) | \(.conclusion // "N/A") | \(.createdAt) |"' >> $GITHUB_STEP_SUMMARY
          
          # Check Security Pipeline
          SEC_RUNS=$(gh run list --workflow="security.yml" --limit=5 --json status,conclusion,createdAt,displayTitle)
          echo "$SEC_RUNS" | jq -r '.[] | "| Security | \(.status) | \(.conclusion // "N/A") | \(.createdAt) |"' >> $GITHUB_STEP_SUMMARY
          
          # Check Code Quality
          QUAL_RUNS=$(gh run list --workflow="code-quality.yml" --limit=5 --json status,conclusion,createdAt,displayTitle)
          echo "$QUAL_RUNS" | jq -r '.[] | "| Code Quality | \(.status) | \(.conclusion // "N/A") | \(.createdAt) |"' >> $GITHUB_STEP_SUMMARY

      - name: Check for failed workflows
        run: |
          echo "🔍 Checking for failed workflows..."
          
          # Check for recent failures
          FAILED_RUNS=$(gh run list --status=failure --limit=10 --json status,conclusion,createdAt,displayTitle,workflowName)
          
          if [ "$(echo "$FAILED_RUNS" | jq length)" -gt 0 ]; then
            echo "❌ Failed workflows detected:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$FAILED_RUNS" | jq -r '.[] | "- \(.workflowName): \(.displayTitle) (\(.createdAt))"' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please investigate and fix these failures." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No recent workflow failures detected" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # DEPENDENCY HEALTH CHECK
  # =============================================================================
  dependency-health:
    name: Dependency Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check dependency health
        run: |
          echo "🔍 Checking dependency health..."
          
          # Check for outdated dependencies
          echo "## Dependency Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          OUTDATED=$(flutter pub outdated --json | jq -r '.packages[] | select(.current != .latest) | "\(.name): \(.current) -> \(.latest)"')
          
          if [ -n "$OUTDATED" ]; then
            echo "⚠️ Outdated dependencies:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$OUTDATED" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for security vulnerabilities
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if flutter pub audit >/dev/null 2>&1; then
            echo "✅ No security vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security vulnerabilities detected. Run 'flutter pub audit' for details." >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # CODE QUALITY HEALTH CHECK
  # =============================================================================
  code-quality-health:
    name: Code Quality Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check code quality metrics
        run: |
          echo "🔍 Checking code quality metrics..."
          
          # Run quick analysis
          ANALYSIS_OUTPUT=$(flutter analyze --no-fatal-infos 2>&1 || true)
          
          echo "## Code Quality Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count issues by type
          ERRORS=$(echo "$ANALYSIS_OUTPUT" | grep -c "error" || echo "0")
          WARNINGS=$(echo "$ANALYSIS_OUTPUT" | grep -c "warning" || echo "0")
          INFO=$(echo "$ANALYSIS_OUTPUT" | grep -c "info" || echo "0")
          
          echo "| Issue Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| Info | $INFO |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS errors found. Please fix them." >> $GITHUB_STEP_SUMMARY
          elif [ "$WARNINGS" -gt 10 ]; then
            echo "⚠️ $WARNINGS warnings found. Consider addressing them." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Code quality looks good!" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # NOTIFICATION
  # =============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [workflow-health, dependency-health, code-quality-health]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🛡️ CI Guard Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Health | ${{ needs.workflow-health.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Health | ${{ needs.dependency-health.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality Health | ${{ needs.code-quality-health.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.workflow-health.result }}" != "success" || 
                "${{ needs.dependency-health.result }}" != "success" || 
                "${{ needs.code-quality-health.result }}" != "success" ]]; then
            echo "❌ Some health checks failed. Please review the details above." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All health checks passed!" >> $GITHUB_STEP_SUMMARY
          fi