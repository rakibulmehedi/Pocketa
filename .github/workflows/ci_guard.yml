name: CI Guard

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run CI guard scripts
        run: |
          chmod +x scripts/perf_checks.sh
          ./scripts/perf_checks.sh