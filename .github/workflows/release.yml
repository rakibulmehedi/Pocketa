name: 🚀 Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major
      pre_release:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.32.8'
  JAVA_VERSION: '17'

jobs:
  # =============================================================================
  # PRE-RELEASE VALIDATION
  # =============================================================================
  pre-release-validation:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run comprehensive tests
        run: |
          echo "🧪 Running comprehensive test suite..."
          flutter test --coverage

      - name: Run security audit
        run: |
          echo "🔒 Running security audit..."
          flutter pub audit

      - name: Run static analysis
        run: |
          echo "🔍 Running static analysis..."
          flutter analyze --fatal-infos

      - name: Check code formatting
        run: |
          echo "🎨 Checking code formatting..."
          dart format --output=none --set-exit-if-changed .

      - name: Validate version consistency
        run: |
          echo "📋 Validating version consistency..."
          
          # Get version from pubspec.yaml
          PUBSPEC_VERSION=$(grep "version:" pubspec.yaml | sed 's/version: //')
          echo "Pubspec version: $PUBSPEC_VERSION"
          
          # Get version from tag (if available)
          if [ -n "${{ github.ref_name }}" ]; then
            TAG_VERSION="${{ github.ref_name }}"
            echo "Tag version: $TAG_VERSION"
            
            # Remove 'v' prefix from tag for comparison
            TAG_VERSION_CLEAN=$(echo "$TAG_VERSION" | sed 's/^v//')
            
            if [ "$PUBSPEC_VERSION" != "$TAG_VERSION_CLEAN" ]; then
              echo "❌ Version mismatch between pubspec.yaml and tag"
              exit 1
            fi
          fi
          
          echo "✅ Version consistency validated"

  # =============================================================================
  # BUILD RELEASE ARTIFACTS
  # =============================================================================
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pre-release-validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          echo "📱 Building Android APK..."
          flutter build apk --release --target-platform android-arm64

      - name: Build Android App Bundle
        run: |
          echo "📦 Building Android App Bundle..."
          flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/
            build/app/outputs/bundle/

  build-ios:
    name: Build iOS Release
    runs-on: macos-latest
    timeout-minutes: 30
    needs: pre-release-validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          echo "🍎 Building iOS..."
          flutter build ios --release --no-codesign

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.ref_name }}
          path: build/ios/

  build-web:
    name: Build Web Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-release-validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          echo "🌐 Building Web..."
          flutter build web --release

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.ref_name }}
          path: build/web/

  build-desktop:
    name: Build Desktop Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: pre-release-validation
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Desktop
        run: |
          echo "🖥️ Building ${{ matrix.platform }}..."
          flutter build ${{ matrix.platform }} --release

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release-${{ github.ref_name }}
          path: build/${{ matrix.platform }}/

  # =============================================================================
  # CREATE GITHUB RELEASE
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-web, build-desktop]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate release notes
        run: |
          echo "📝 Generating release notes..."
          
          # Get version
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          # Generate changelog
          echo "# Pocketa $VERSION" > release_notes.md
          echo "" >> release_notes.md
          echo "## 🚀 What's New" >> release_notes.md
          echo "" >> release_notes.md
          
          # Get commits since last tag
          if git describe --tags --abbrev=0 HEAD~1 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1)
            echo "### Changes since $LAST_TAG" >> release_notes.md
            echo "" >> release_notes.md
            git log --oneline --pretty=format:"- %s" $LAST_TAG..HEAD >> release_notes.md
          else
            echo "### Initial Release" >> release_notes.md
            echo "" >> release_notes.md
            git log --oneline --pretty=format:"- %s" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "## 📱 Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Android" >> release_notes.md
          echo "- APK: Download from the assets below" >> release_notes.md
          echo "- App Bundle: Available for Play Store submission" >> release_notes.md
          echo "" >> release_notes.md
          echo "### iOS" >> release_notes.md
          echo "- Archive: Available for App Store submission" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Web" >> release_notes.md
          echo "- Web App: Deploy the web artifacts to your hosting service" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Desktop" >> release_notes.md
          echo "- macOS, Windows, and Linux builds available" >> release_notes.md
          
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: Pocketa ${{ github.ref_name || github.event.inputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ github.event.inputs.pre_release == 'true' }}
          files: |
            artifacts/android-release-*/**/*
            artifacts/ios-release-*/**/*
            artifacts/web-release-*/**/*
            artifacts/*-release-*/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # DEPLOYMENT (Optional)
  # =============================================================================
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.ref == 'refs/heads/main' && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'beta')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-release-${{ github.ref_name }}
          path: ./web-build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-build
          cname: pocketa.app  # Replace with your domain

  # =============================================================================
  # POST-RELEASE TASKS
  # =============================================================================
  post-release:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update version in main branch
        run: |
          echo "🔄 Updating version in main branch..."
          
          # This would typically update version numbers, create new branches, etc.
          # For now, just log the completion
          echo "✅ Release ${{ github.ref_name }} completed successfully"
          
      - name: Notify team
        run: |
          echo "📢 Release notification would be sent here"
          echo "Release: ${{ github.ref_name }}"
          echo "Status: ${{ needs.create-release.result }}"
