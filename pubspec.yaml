name: pocketa
description: "Clean Architecture-based Expense Management App built with Flutter, Riverpod, and Hive for offline-first personal finance tracking."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  go_router: ^16.2.0
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.6.1
  shared_preferences: ^2.5.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  hive: ^2.2.3
  equatable: ^2.0.7
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0


flutter:
  assets:
    - assets/
    
  uses-material-design: true
  generate: true
